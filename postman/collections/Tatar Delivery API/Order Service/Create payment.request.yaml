$kind: http-request
method: POST
url: '{{orderServiceUrl}}/api/payment/create'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "amount": 100.00,
      "description": "Payment for order {{orderId}}"
    }
